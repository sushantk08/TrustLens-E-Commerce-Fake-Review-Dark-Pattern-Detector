version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: trustlens_postgres
    environment:
      POSTGRES_DB: trustlens_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: trustlens_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: trustlens_backend
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 trustlens_core.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-trustlens-prod-docker-key
      - DEBUG=True
      - DB_NAME=trustlens_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
    container_name: trustlens_celery
    command: celery -A trustlens_core worker -l info
    volumes:
      - ./backend:/app
    environment:
      - SECRET_KEY=django-insecure-trustlens-prod-docker-key
      - DEBUG=True
      - DB_NAME=trustlens_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend

volumes:
  postgres_data: